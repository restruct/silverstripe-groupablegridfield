name: CI

on:
  push:
    # main is the default branch (portfolio convention; the repo's default is still `master` until
    # it is renamed through GitHub's rename API). The older release line (v2, Silverstripe 4/5) is
    # a hotfix branch without CI.
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: SS${{ matrix.silverstripe }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per supported Silverstripe major, at the oldest and newest PHP that major is
          # used with here. The module's composer.json is the source of truth for the supported
          # range; this matrix must follow it.
          - silverstripe: '5'
            php: '8.1'
            recipe: '^5'
            testing: '^3'
          - silverstripe: '5'
            php: '8.3'
            recipe: '^5'
            testing: '^3'
          - silverstripe: '6'
            php: '8.3'
            recipe: '^6'
            testing: '^4'
          - silverstripe: '6'
            php: '8.4'
            recipe: '^6'
            testing: '^4'

    services:
      database:
        # MariaDB rather than MySQL: it matches both the local dev machines and the Forge
        # servers, so a version-specific failure here means something real.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ss_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Check out the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, mysqli, gd, zip, dom, xml, tokenizer, simplexml, ctype, hash, session
          tools: composer:v2
          coverage: none

      - name: Build a host project
        # The module cannot be tested on its own: it needs a booted Silverstripe app. The host
        # composer.json is written by hand; recipe-cms brings in the admin the GridField runs in
        # (the module itself only requires framework, gridfieldextensions and multivaluefield).
        #
        # The module is pulled in through a PATH repository pointing at the checkout, symlinked
        # rather than mirrored: /tests is export-ignore in .gitattributes, so a mirrored
        # (dist-style) install would contain no tests at all and the suite would silently pass
        # with nothing in it.
        run: |
          mkdir -p app-host
          cd app-host
          cat > composer.json <<JSON
          {
            "name": "restruct/ci-host",
            "require": {
              "silverstripe/recipe-cms": "${{ matrix.recipe }}",
              "silverstripe/recipe-testing": "${{ matrix.testing }}",
              "restruct/silverstripe-groupable-gridfield": "*"
            },
            "repositories": [
              { "type": "path", "url": "../module", "options": { "symlink": true } }
            ],
            "autoload-dev": {
              "psr-4": {
                "Restruct\\\\Silverstripe\\\\GroupableGridfield\\\\Tests\\\\": "vendor/restruct/silverstripe-groupable-gridfield/tests/"
              }
            },
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": { "allow-plugins": true }
          }
          JSON
          # Silverstripe 5 is in security-fixes-only until its April 2027 EOL, and every release of
          # silverstripe/cms 5 is covered by advisory PKSA-pjvm-vnw2-n3m2 (range <6.2.1), which will
          # not be patched there. Composer therefore refuses to install it under the default policy.
          # Blocking is disabled HERE ONLY, in a throwaway CI host project.
          composer config policy.advisories.block false
          composer update --no-interaction --no-progress

      - name: Configure the test suite
        # The module's own phpunit.xml.dist is the single copy of the runner settings (bootstrap,
        # failOnWarning pinned because warning-to-error escalation differs between PHPUnit 9 on
        # SS5 and 11 on SS6). CI copies it and appends only the consumer suite, so a settings
        # change cannot drift between the two.
        run: |
          cd app-host
          cp ../module/phpunit.xml.dist phpunit.xml
          perl -0pi -e 's#(\s*)</testsuites>#$1    <testsuite name="consumer">$1        <directory>app/tests</directory>$1    </testsuite>$1</testsuites>#' phpunit.xml
          grep -q '<testsuite name="consumer">' phpunit.xml
          cat phpunit.xml

      - name: Add a consumer-shape database test
        # A module's own suite cannot catch a test fixture that breaks CONSUMING projects: its
        # fixtures are loaded by PHPUnit, not registered in the class manifest. This test runs as
        # the consumer would, with the module's tests/ in the manifest, and must still build the
        # temp database.
        run: |
          mkdir -p app-host/app/tests
          cat > app-host/app/tests/ConsumerDbTest.php <<'PHP'
          <?php

          use SilverStripe\Dev\SapphireTest;
          use SilverStripe\Security\Member;

          class ConsumerDbTest extends SapphireTest
          {
              protected $usesDatabase = true;

              public function testTempDatabaseBuilds()
              {
                  $m = Member::create(['FirstName' => 'x']);
                  $m->write();
                  $this->assertGreaterThan(0, $m->ID);
              }
          }
          PHP

      - name: Run tests
        working-directory: app-host
        env:
          SS_DATABASE_CLASS: MySQLDatabase
          SS_DATABASE_SERVER: 127.0.0.1
          SS_DATABASE_PORT: 3306
          SS_DATABASE_USERNAME: root
          SS_DATABASE_PASSWORD: root
          SS_DATABASE_NAME: ss_ci
          SS_ENVIRONMENT_TYPE: dev
          # PHPUnit 11 (SS6) ignores a `flush=1` argument, so the manifest is flushed through
          # this instead. It is read only by framework 6: on framework 5 it does nothing and does
          # NOT flush, so the SS5 legs flush with a path-first `flush=1` argument below.
          SS_PHPUNIT_FLUSH: 1
        # Flush on every run, or a stale test manifest reads as a broken test. On SS5 the flush
        # must be a `flush=1` argument AFTER a path: with `--testsuite <name> flush=1`, PHPUnit 9
        # takes `flush=1` as the test file, aborts with 'Cannot open file "flush=1".' and exits 1,
        # so the suites are addressed by their directories there.
        #
        # --fail-on-empty-test-suite on every leg (PHPUnit 9.6 accepts it too, although its --help
        # does not list it; phpunit.xml.dist also sets failOnEmptyTestSuite): a suite that loaded
        # no tests at all otherwise ends green.
        run: |
          if [ "${{ matrix.silverstripe }}" = "6" ]; then
            vendor/bin/phpunit --fail-on-empty-test-suite --testsuite groupable-gridfield
            vendor/bin/phpunit --fail-on-empty-test-suite --testsuite consumer
          else
            vendor/bin/phpunit --fail-on-empty-test-suite vendor/restruct/silverstripe-groupable-gridfield/tests flush=1
            vendor/bin/phpunit --fail-on-empty-test-suite app/tests flush=1
          fi

      - name: Boot the app and build the database
        # The suite proves the classes behave; this proves the module does not break a real boot
        # or a flush (where an unguarded optional dependency would fatal).
        working-directory: app-host
        env:
          SS_DATABASE_CLASS: MySQLDatabase
          SS_DATABASE_SERVER: 127.0.0.1
          SS_DATABASE_PORT: 3306
          SS_DATABASE_USERNAME: root
          SS_DATABASE_PASSWORD: root
          SS_DATABASE_NAME: ss_ci
          SS_ENVIRONMENT_TYPE: dev
        run: |
          if [ "${{ matrix.silverstripe }}" = "6" ]; then
            vendor/bin/sake db:build --flush
          else
            vendor/bin/sake dev/build flush=1
          fi

  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the module's declared php constraint.
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check every PHP file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
